apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-retail-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-retail-api
  template:
    metadata:
      labels:
        app: online-retail-api
    spec:
      containers:
        - name: api
          image: online-retail-api:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
